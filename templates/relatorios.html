{% extends 'index.html' %}


{% block scripts %}

<script
    defer
    src="{{ url_for('static', filename='js/planejamento.js') }}">
</script>

{% endblock %}


{% block conteudo %}


<!-- =========================
     TÍTULO DA PÁGINA
========================== -->

<div class="titulo">

    <div>

        <p class="eyebrow">
            EVOLUÇÃO
        </p>

        <h1>
            Compare seus meses
        </h1>

        <p>
            Veja o que mudou nas suas finanças.
        </p>

    </div>

</div>


<!-- =========================
     COMPARAÇÃO DE MESES
========================== -->

<section class="painel">

    <form
        id="form-comparacao"
        class="filtros">


        <!-- Primeiro mês -->

        <label>

            Primeiro mês

            <input
                name="primeiro"
                type="month"
                required>

        </label>


        <!-- Segundo mês -->

        <label>

            Segundo mês

            <input
                name="segundo"
                type="month"
                required>

        </label>


        <!-- Botão -->

        <button type="submit">
            Comparar
        </button>

    </form>


    <!-- Resultado da comparação -->

    <div id="comparacao">
    </div>

</section>


{% endblock %}
